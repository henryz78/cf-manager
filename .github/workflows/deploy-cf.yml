name: Deploy to Cloudflare Pages

# 入口工作流 —— 直接输入 Cloudflare 凭据，脱敏后调用 composite action
# 适用于：无 GitHub Environments 配置、手动触发时直接传Key 的场景
#
# 凭据二选一（都填时优先使用 API Token）：
#   1) cf_api_token                — Cloudflare API Token（推荐）
#   2) cf_global_key + cf_email    — Global API Key（legacy，二者必须同时填写）
# 两者都未填写将在第一个步骤立即终止。

on:
  workflow_dispatch:
    inputs:
      cf_api_token:
        description: 'Cloudflare API Token（与 cf_global_key 二选一；推荐，官方已把 Global API Key 标记为 legacy）'
        required: false
        type: string
      cf_global_key:
        description: 'Cloudflare Global API Key（与 cf_api_token 二选一；需同时填写 cf_email）'
        required: false
        type: string
      cf_email:
        description: 'Cloudflare 账号邮箱（使用 Global API Key 时必填，仅在本脚本内使用，绝不打印到日志）'
        required: false
        type: string
      project_name:
        description: 'Pages 项目名称'
        required: false
        default: 'cfmgr'
        type: string
      d1_database_name:
        description: 'D1 数据库名称'
        required: false
        default: 'cfmgr'
        type: string
      kv_namespace_name:
        description: 'KV 命名空间名称（用于缓存和粘性路由）'
        required: false
        default: 'cfmgr'
        type: string
      encryption_key:
        description: '加密密钥（用于加密存储 API Token）'
        required: false
        default: 'cfmgrbest'
        type: string
      api_secret:
        description: '访问密码（留空则无需登录）'
        required: false
        default: 'cfmgrbest'
        type: string
      demo_mode:
        description: '演示模式：保护部署账户（禁止编辑/删除等破坏性操作）'
        required: false
        default: true
        type: boolean
      full_wipe:
        description: '完全覆盖：删除并重建 D1 数据库 + 清空 KV 命名空间'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 非交互 CI 下，wrangler 必须通过环境变量认证。
    # 敏感输入绝不能放在 job 级 env —— 否则每个步骤的「env:」头都会把明文打印到日志。
    # 拆成两步：第一步注册脱敏并写入 $GITHUB_ENV（本步骤脚本正文必然含明文，
    # GitHub 在执行前会回显脚本，这是 inputs 唯一无法避免的暴露面）；
    # 第二步起一律用 $VAR 引用，日志中均为 ***，也不会把输入插值进脚本正文。
    steps:
      # checkout 必须在调用本地 composite action 之前执行，否则 runner 找不到 action.yml
      - uses: actions/checkout@v5

      - name: Mask secrets and export to env
        run: |
          CF_TOKEN="${{ secrets.CLOUDFLARE_API_TOKEN || vars.CLOUDFLARE_API_TOKEN || github.event.inputs.cf_api_token }}"
          CF_KEY="${{ secrets.CLOUDFLARE_API_KEY || vars.CLOUDFLARE_API_KEY || secrets.CF_API_KEY || vars.CF_API_KEY || secrets.CF_GLOBAL_KEY || vars.CF_GLOBAL_KEY || github.event.inputs.cf_global_key || github.event.inputs.cf_api_key }}"
          CF_MAIL="${{ secrets.CLOUDFLARE_EMAIL || vars.CLOUDFLARE_EMAIL || secrets.CF_EMAIL || vars.CF_EMAIL || github.event.inputs.cf_email }}"
          ENC_KEY="${{ secrets.ENCRYPTION_KEY || vars.ENCRYPTION_KEY || github.event.inputs.encryption_key }}"
          API_SEC="${{ secrets.API_SECRET || vars.API_SECRET || github.event.inputs.api_secret }}"
          DEMO_M="${{ secrets.DEMO_MODE || vars.DEMO_MODE || github.event.inputs.demo_mode || 'false' }}"
          
          [ -n "$CF_TOKEN" ] && echo "::add-mask::$CF_TOKEN"
          [ -n "$CF_KEY" ] && echo "::add-mask::$CF_KEY"
          [ -n "$CF_MAIL" ] && echo "::add-mask::$CF_MAIL"
          [ -n "$ENC_KEY" ] && echo "::add-mask::$ENC_KEY"
          [ -n "$API_SEC" ] && echo "::add-mask::$API_SEC"
          
          # 仅在非空时导出：避免 wrangler 读到「已设置但为空」的 CLOUDFLARE_API_TOKEN
          [ -n "$CF_TOKEN" ] && echo "CLOUDFLARE_API_TOKEN=$CF_TOKEN" >> $GITHUB_ENV
          [ -n "$CF_KEY" ] && echo "CLOUDFLARE_GLOBAL_KEY=$CF_KEY" >> $GITHUB_ENV
          [ -n "$CF_KEY" ] && echo "CLOUDFLARE_API_KEY=$CF_KEY" >> $GITHUB_ENV
          [ -n "$CF_MAIL" ] && echo "CLOUDFLARE_EMAIL=$CF_MAIL" >> $GITHUB_ENV
          echo "ENCRYPTION_KEY=$ENC_KEY" >> $GITHUB_ENV
          echo "API_SECRET=$API_SEC" >> $GITHUB_ENV
          echo "DEMO_MODE=$DEMO_M" >> $GITHUB_ENV
          echo "PROJECT_NAME=${{ secrets.PROJECT_NAME || vars.PROJECT_NAME || github.event.inputs.project_name || 'cfmgr' }}" >> $GITHUB_ENV
          echo "D1_DATABASE_NAME=${{ secrets.D1_DATABASE_NAME || vars.D1_DATABASE_NAME || github.event.inputs.d1_database_name || 'cfmgr' }}" >> $GITHUB_ENV
          echo "KV_NAMESPACE_NAME=${{ secrets.KV_NAMESPACE_NAME || vars.KV_NAMESPACE_NAME || github.event.inputs.kv_namespace_name || 'cfmgr' }}" >> $GITHUB_ENV

      - name: Validate credentials
        run: |
          # 凭据二选一校验：Global API Key + Email（legacy），或 API Token（推荐）。
          # 全部用 $VAR 引用（已脱敏），不把输入直接插值进脚本正文。
          # 在进入 Deploy 前失败，避免后续步骤带着空凭据发出必然 401 的请求。
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            if [ -n "$CLOUDFLARE_GLOBAL_KEY" ] || [ -n "$CLOUDFLARE_EMAIL" ]; then
              echo "::warning::同时填写了 API Token 与 Global API Key/邮箱，将优先使用 API Token"
            fi
          elif [ -z "$CLOUDFLARE_GLOBAL_KEY" ] || [ -z "$CLOUDFLARE_EMAIL" ]; then
            echo "::error::必须填写以下任一凭据组合："
            echo "::error::  1) cf_api_token — Cloudflare API Token（推荐）"
            echo "::error::  2) cf_global_key + cf_email — Global API Key（legacy，二者必须同时填写）"
            exit 1
          fi
          echo "凭据校验通过（认证方式：$([ -n "$CLOUDFLARE_API_TOKEN" ] && echo 'API Token' || echo 'Global API Key')）"

      - name: Deploy
        uses: ./.github/actions/deploy-cf
        with:
          project_name: ${{ env.PROJECT_NAME }}
          d1_database_name: ${{ env.D1_DATABASE_NAME }}
          kv_namespace_name: ${{ env.KV_NAMESPACE_NAME }}
          demo_mode: ${{ env.DEMO_MODE }}
          full_wipe: ${{ github.event.inputs.full_wipe }}
